apiVersion: v1
kind: Service
metadata:
  name: cv-app-service
spec:
  selector:
    app: cv-app
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
  type: LoadBalancer  # Use NodePort or ClusterIP as needed
